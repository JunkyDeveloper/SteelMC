name: PR auto-labeler

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Sync labels from "Type of change" checklist
        uses: actions/github-script@v7
        with:
          script: |
            // Maps the PR template's "Type of change" checkbox text to a label.
            // If the label doesn't exist in the repo yet, it's created on first use.
            const TYPE_LABELS = [
              { text: "Block implementation",     label: "block",           color: "1d76db" },
              { text: "Item implementation",       label: "item",            color: "1d76db" },
              { text: "Command implementation",    label: "command",         color: "1d76db" },
              { text: "Entity implementation",     label: "entity",          color: "1d76db" },
              { text: "Bug fix",                   label: "bug",             color: "d73a4a" },
              { text: "New feature",               label: "enhancement",     color: "a2eeef" },
              { text: "Breaking change",           label: "breaking change", color: "b60205" },
              { text: "Refactor / code cleanup",   label: "refactor",        color: "cfd3d7" },
              { text: "Performance improvement",   label: "performance",     color: "fbca04" },
              { text: "Chore / tooling",           label: "chore",           color: "cccccc" },
            ];

            const body = context.payload.pull_request.body || "";

            // Matches "- [x] Some text" (case-insensitive on the x) checklist lines.
            const checked = new Set();
            for (const line of body.split("\n")) {
              const m = line.match(/^\s*-\s*\[\s*[xX]\s*\]\s*(.+?)\s*$/);
              if (m) checked.add(m[1].trim());
            }

            const wantedLabels = new Set(
              TYPE_LABELS.filter(t => checked.has(t.text)).map(t => t.label)
            );
            const managedLabels = new Set(TYPE_LABELS.map(t => t.label));

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const current = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number,
            });
            const currentNames = new Set(current.map(l => l.name));

            const toAdd = [...wantedLabels].filter(l => !currentNames.has(l));
            const toRemove = [...currentNames].filter(l => managedLabels.has(l) && !wantedLabels.has(l));

            for (const labelName of toAdd) {
              const meta = TYPE_LABELS.find(t => t.label === labelName);
              try {
                await github.rest.issues.getLabel({ owner, repo, name: labelName });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({
                    owner, repo, name: labelName, color: meta.color,
                  });
                } else {
                  throw e;
                }
              }
            }

            if (toAdd.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: toAdd });
            }
            for (const labelName of toRemove) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: labelName });
            }
